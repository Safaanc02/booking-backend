name: CI

on:
  push:
    # mvp figure dans la liste : le développement s'y fait, et la CI ne
    # s'exécutait donc jamais sur les poussées — seulement sur les pull
    # requests, c'est-à-dire jamais dans les faits.
    branches: [main, mvp]
  pull_request:

# Une nouvelle poussée sur la même branche annule l'exécution en cours :
# valider un état déjà remplacé ne sert à rien et occupe les exécuteurs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compiler et tester
        run: ./mvnw -B --no-transfer-progress verify
        env:
          # Aucune valeur par défaut n'existe pour ce mot de passe : l'absence
          # ferait échouer le démarrage du contexte, ce qui est voulu.
          DB_PASSWORD: ci-sans-importance

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-surefire
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Migrations Flyway sur PostgreSQL
    runs-on: ubuntu-latest

    # Vérifie que les migrations s'appliquent réellement, et que les entités
    # correspondent au schéma obtenu (ddl-auto=validate). Le test Testcontainers
    # couvre la même chose mais reste ignoré faute de démon Docker exploitable
    # en local ; ici le service PostgreSQL est fourni par le runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beauty_booking
          POSTGRES_USER: booking_user
          POSTGRES_PASSWORD: ci-sans-importance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking_user -d beauty_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Appliquer les migrations et valider le schéma
        # package avant start : spring-boot:start cherche une classe
        # principale dans les classes compilées, et échouait sur « Unable to
        # find a suitable main class » faute d'avoir compilé quoi que ce soit.
        # Les tests sont ignorés ici, l'autre tâche s'en charge.
        run: |
          ./mvnw -B --no-transfer-progress package -DskipTests
          ./mvnw -B --no-transfer-progress spring-boot:start spring-boot:stop
        env:
          DB_URL: jdbc:postgresql://localhost:5432/beauty_booking
          DB_USER: booking_user
          DB_PASSWORD: ci-sans-importance
          # Le contexte démarre sans joindre Keycloak : le décodeur de jetons
          # est construit paresseusement depuis la jwk-set-uri.
          KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/booking-realm
          MAIL_ACTIF: 'false'
