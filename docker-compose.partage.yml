# Pile complète et autonome, pour faire essayer l'application.
#
# Différences avec docker-compose.yml, qui sert au développement :
#
#   • une seule adresse exposée. Caddy sert le site à la racine, l'API sous
#     /api, Keycloak sous /auth. Il n'y a donc plus de CORS, plus d'URI de
#     redirection à réécrire par environnement, et une seule adresse à
#     transmettre.
#
#   • Keycloak démarre en mode « start » sur PostgreSQL, et non « start-dev ».
#     En développement il garde tout en mémoire : chaque redémarrage effaçait
#     les comptes créés depuis l'import du realm. Inacceptable dès que
#     quelqu'un d'autre essaie l'application.
#
#   • aucun mot de passe par défaut. Les valeurs de développement sont
#     publiques : sur une adresse joignable, elles reviennent à ne rien
#     protéger.
#
# ⚠️ Ce n'est pas une mise en production. Les comptes de démonstration ont
#    pour mot de passe leur identifiant, et la boîte aux lettres de test est
#    lisible par quiconque connaît l'adresse — donc quiconque connaît
#    l'adresse peut devenir administrateur. Traitez l'adresse comme un secret,
#    et n'y mettez aucune donnée réelle de client.
#
#   ./scripts/partager.sh https://mon-adresse-publique

#
# ---- Dimensionnement ----
#
# Chaque service est borné en mémoire. Sans limite, la JVM se sert de 75 % de
# la machine entière : mesurée à 1,07 Gio pour l'API sur un poste de 4 Gio,
# alors que 576 Mio de tas lui suffisent. Sur un serveur à 4 €, cette
# gourmandise se paie en évictions.
#
# Bornée ainsi, la pile tient dans ~1,9 Gio : une machine de 2 Gio passe
# juste, 4 Gio est confortable. MaxRAMPercentage devient alors un pourcentage
# de la limite du conteneur, ce qui est le comportement voulu.
#
name: booking-partage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beauty_booking
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD dans partage.env}
      TZ: Africa/Casablanca
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
      # Crée la base de Keycloak. Ne s'exécute qu'à la première initialisation.
      - ./docker/init-bases.sql:/docker-entrypoint-initdb.d/init-bases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d beauty_booking"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start --optimized=false --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?definir KEYCLOAK_ADMIN_PASSWORD dans partage.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: booking_user
      KC_DB_PASSWORD: ${DB_PASSWORD}
      # Servi sous /auth : une seule adresse publique pour tout.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      # L'adresse publique, telle que le navigateur la voit. Elle détermine
      # l'émetteur inscrit dans les jetons — que l'API vérifie ensuite.
      # Le chemin est inclus, et c'est nécessaire : donnée en URL complète,
      # cette valeur remplace http-relative-path au lieu de s'y ajouter.
      # Sans « /auth », Keycloak annonçait ses points d'entrée en /realms/…,
      # que le proxy envoie au site — et la connexion tombait sur la page 404
      # de l'application.
      #
      # Le protocole y figure aussi, et c'est lui qui dit à Keycloak s'il est
      # derrière du TLS : une adresse en http:// suffit à ne pas l'exiger.
      KC_HOSTNAME: ${URL_PUBLIQUE:?definir URL_PUBLIQUE dans partage.env}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      TZ: Africa/Casablanca
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image ne contient ni curl ni wget : on ouvre une socket sur le port
      # de management. Les CRLF sont exigés par HTTP.
      # Le chemin porte le préfixe : l'interface de management reprend par
      # défaut la valeur de http-relative-path, donc /auth/health/ready et non
      # /health/ready. Sondé au mauvais endroit, un Keycloak parfaitement
      # démarré restait « health: starting » indéfiniment, et l'API — qui
      # l'attend — ne démarrait jamais.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  api:
    build: .
    volumes:
      - photos_salons:/var/lib/booking/photos
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/beauty_booking
      DB_USER: booking_user
      DB_PASSWORD: ${DB_PASSWORD}
      # L'émetteur doit correspondre au caractère près à celui que Keycloak
      # inscrit dans les jetons, sans quoi toute requête authentifiée est
      # rejetée avec un message peu parlant.
      KEYCLOAK_ISSUER_URI: ${URL_PUBLIQUE}/auth/realms/booking-realm
      # Les appels sortants restent sur le réseau interne : dans un conteneur,
      # « localhost » désigne l'API, et sortir par l'adresse publique pour
      # revenir aussitôt ne marche que par chance.
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/booking-realm/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?definir KEYCLOAK_ADMIN_CLIENT_SECRET dans partage.env}
      # Sert à composer les liens des e-mails : invitation d'un gérant,
      # annulation d'un rendez-vous.
      URL_PUBLIQUE: ${URL_PUBLIQUE}
      # Même origine que le site : aucune requête ne traverse plus les
      # frontières du navigateur. La valeur reste utile si l'on ouvre un jour
      # une seconde façade.
      CORS_ORIGINS: ${URL_PUBLIQUE}
      # Les liens d'annulation sont signés : un secret connu se contrefait.
      ANNULATION_SECRET: ${ANNULATION_SECRET:?definir ANNULATION_SECRET dans partage.env}
      # Les photos vivent sur un volume, pas dans la couche du conteneur : sans
      # lui, elles disparaîtraient à chaque reconstruction de l'image, sans
      # erreur, ne laissant que des cadres vides sur les fiches.
      PHOTOS_REPERTOIRE: /var/lib/booking/photos
      # Le schéma d'API décrit toute la surface d'attaque. Fermé.
      OPENAPI_ACTIF: "false"
      # Aucun serveur par défaut.
      #
      # docker-compose.demo.yml y met la boîte de test ; en production, c'est
      # à partage.env de désigner un vrai fournisseur. La garde ne peut pas
      # vivre ici : Compose interpole chaque fichier avant de les fusionner,
      # si bien qu'un « ${VAR:?} » dans la base refuserait ce que le
      # complément fournit. C'est scripts/durcir-production.mjs qui le
      # contrôle.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_TLS: ${MAIL_TLS:-true}
      MAIL_FROM: ${MAIL_FROM:-ne-pas-repondre@booking.ma}
      TZ: Africa/Casablanca
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Sans sonde, Docker ne relance que si le processus meurt : une API
    # bloquée, ou qui répond 500 à tout, restait « up » indéfiniment.
    #
    # L'image ne contient ni curl ni wget : on ouvre une socket.
    #
    # bash et non CMD-SHELL : /dev/tcp est une facilité de bash, absente de
    # dash — que Debian fournit comme /bin/sh, et que CMD-SHELL invoque. La
    # sonde échouait sur « Directory nonexistent », et l'API restait
    # « health: starting » indéfiniment alors qu'elle répondait très bien.
    #
    # Les CRLF sont exigés par HTTP.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    build: ../booking-frontend
    ports:
      - "${PORT_PUBLIC:-8090}:80"
    depends_on:
      - api
      - keycloak
    # Le proxy est ce que voit le visiteur : sa santé est celle du service.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

volumes:
  donnees_postgres:
  photos_salons:
