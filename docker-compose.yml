name: booking

services:
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: beauty_booking
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-beauty123}
      TZ: Africa/Casablanca
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d beauty_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: booking-keycloak
    command: start-dev --http-port=8081 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      TZ: Africa/Casablanca
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Thème de connexion. En mode start-dev le cache de thèmes est désactivé :
      # une modification de CSS est visible au simple rechargement de la page.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # L'image Keycloak ne contient ni curl ni wget : on ouvre une socket
      # via /dev/tcp sur le port de management (KC_HEALTH_ENABLED).
      # Les CRLF sont obligatoires, HTTP les exige.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Serveur SMTP de développement : capture tous les messages sans jamais les
  # livrer, et les expose via une interface web et une API sur 8025.
  # Indispensable pour vérifier les envois au lieu de les supposer.
  mailpit:
    image: axllent/mailpit:latest
    container_name: booking-mailpit
    environment:
      TZ: Africa/Casablanca
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web et API

volumes:
  postgres_data:
