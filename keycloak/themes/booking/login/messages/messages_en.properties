# La marque ne se traduit pas : on la fixe dans chaque langue pour que
# l'en-tête reste « DarZin » et non le displayName brut du realm.
#
# `loginTitle` est le titre de l'onglet. Sans lui, `base` reprend « Sign in to
# {0} » avec le displayName du realm — lequel, sur un realm importé avant le
# changement de nom, annonçait encore « Booking.ma » dans chaque onglet
# ouvert. La marque ne doit dépendre d'aucune valeur de configuration.
loginTitle=Sign in — DarZin
loginTitleHtml=<span class="b-brand-texte">darzin</span>

# Clé propre au thème : absente de `base`, elle s'afficherait telle quelle.
infoActionsRestantes=Before reaching your workspace:
confirmExecutionOfActions=Welcome to DarZin
accountUpdatedMessage=Your password is saved. You can now reach your workspace.
backToApplication=Continue to DarZin
