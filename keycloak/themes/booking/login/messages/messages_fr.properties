# Formulations Booking.ma — remplacent celles de Keycloak.
#
# L'écran d'authentification est le point du parcours où l'on perd le plus de
# monde : le vocabulaire y compte autant que l'apparence. « Nom d'utilisateur
# ou e-mail » est du jargon d'outil, pas une phrase adressée à un client.

# Apostrophes : ne jamais écrire ' dans une valeur.
#
# Keycloak passe chaque message par java.text.MessageFormat, où ' ouvre une
# section littérale et disparaît de la sortie — « Avant d'accéder » s'affichait
# « Avant daccéder », et « n'est pas valide » « nest pas valide ». Le thème de
# base contourne le problème en doublant ('') ; on utilise plutôt l'apostrophe
# typographique ’, qui n'a aucun sens pour MessageFormat et qui est de toute
# façon la bonne en français.

