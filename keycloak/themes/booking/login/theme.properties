# Thème de connexion Booking.ma
#
# parent=base et non keycloak.v2 : le thème par défaut embarque PatternFly,
# et le surcharger revient à lutter contre une feuille de style entière.
# `base` ne fournit que la logique FreeMarker, sans aucun style.
#
# Tous les gabarits de `base` désignent leurs éléments par ${properties.kcXxx}.
# Il suffit donc de rattacher ces clés à nos propres classes pour habiller
# l'ensemble des écrans — connexion, inscription, mot de passe oublié, double
# authentification, erreurs — sans réécrire un seul .ftl. C'est ce qui rend ce
# thème peu coûteux à maintenir : une montée de version de Keycloak apporte ses
# corrections de gabarits, nous ne gardons que l'apparence.
parent=base

locales=fr,ar,en

styles=css/booking.css

# `base` ne charge pas ce script, contrairement à keycloak.v2 : sans lui, le
# bouton de révélation du mot de passe est inerte.
scripts=js/passwordVisibility.js
meta=viewport==width=device-width,initial-scale=1

# ---- Structure ----
kcHtmlClass=b-html
kcBodyClass=b-body
kcLoginClass=b-login
kcHeaderClass=b-header
kcHeaderWrapperClass=b-brand
kcFormCardClass=b-card
kcFormHeaderClass=b-card-header
kcContentWrapperClass=b-content
kcInfoAreaWrapperClass=b-aside

# ---- Formulaires ----
kcFormClass=b-form
kcFormGroupClass=b-field
kcFormGroupErrorClass=b-field--erreur
kcLabelClass=b-label
kcLabelWrapperClass=b-label-zone
kcInputWrapperClass=b-input-zone
kcInputClass=b-input
kcInputGroup=b-input-group
kcInputErrorMessageClass=b-erreur
kcInputHelperTextBeforeClass=b-aide
kcInputHelperTextAfterClass=b-aide

# ---- Mot de passe : bouton œil ----
kcFormPasswordVisibilityButtonClass=b-oeil
kcFormPasswordVisibilityIconShow=b-oeil-montrer
kcFormPasswordVisibilityIconHide=b-oeil-cacher

# ---- Cases à cocher et radios ----
kcCheckboxInputClass=b-case
kcInputClassCheckbox=b-case-zone
kcInputClassCheckboxInput=b-case
kcInputClassCheckboxLabel=b-case-label
kcInputClassRadio=b-case-zone
kcInputClassRadioInput=b-case
kcInputClassRadioLabel=b-case-label
kcInputClassRadioCheckboxLabelDisabled=b-case-label--inactif

# ---- Options et actions ----
kcFormOptionsClass=b-options
kcFormOptionsWrapperClass=b-options-zone
kcFormSettingClass=b-reglages
kcFormButtonsClass=b-actions
kcSignUpClass=b-inscription

# ---- Boutons ----
kcButtonClass=b-bouton
kcButtonPrimaryClass=b-bouton--principal
kcButtonDefaultClass=b-bouton--secondaire
kcButtonBlockClass=b-bouton--pleine-largeur
kcButtonLargeClass=b-bouton--grand

# ---- Messages ----
kcAlertClass=b-alerte
kcAlertTitleClass=b-alerte-titre
kcFeedbackErrorIcon=b-alerte--erreur
kcFeedbackWarningIcon=b-alerte--avertissement
kcFeedbackSuccessIcon=b-alerte--succes
kcFeedbackInfoIcon=b-alerte--info

# ---- Fournisseurs d'identité (aucun pour l'instant, mais le style suit) ----
kcFormSocialAccountSectionClass=b-social
kcFormSocialAccountListClass=b-social-liste
kcFormSocialAccountListGridClass=b-social-liste--grille
kcFormSocialAccountGridItem=b-social-item
kcFormSocialAccountListButtonClass=b-bouton b-bouton--secondaire b-bouton--pleine-largeur
kcFormSocialAccountListButtonDisabledClass=b-bouton--inactif
kcFormSocialAccountNameClass=b-social-nom
kcCommonLogoIdP=b-social-logo

# ---- Langue ----
kcLocaleWrapperClass=b-langue
kcLocaleMainClass=b-langue-principal
kcLocaleDropDownClass=b-langue-liste-zone
kcLocaleListClass=b-langue-liste
kcLocaleListItemClass=b-langue-item
kcLocaleItemClass=b-langue-lien

kcResetFlowIcon=b-icone-retour
