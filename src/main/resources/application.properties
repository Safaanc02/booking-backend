spring.application.name=booking

# ============================================================
#  Base de données
#  Aucune valeur par défaut pour le mot de passe : l'application
#  refuse de démarrer s'il n'est pas fourni, plutôt que de tourner
#  avec un secret codé en dur.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beauty_booking}
spring.datasource.username=${DB_USER:booking_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schéma appartient à Flyway. Hibernate se contente de vérifier que les
# entités correspondent — il ne crée ni ne modifie plus rien.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Les instants sont stockés en UTC ; la conversion vers l'heure locale
# se fait à la présentation. Indispensable au Maroc, qui bascule entre
# UTC+1 et UTC+0 à chaque Ramadan.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
#  Localisation — Maroc
# ============================================================
spring.jackson.time-zone=Africa/Casablanca
spring.web.locale=fr_MA
spring.web.locale-resolver=fixed
app.devise=MAD
app.fuseau=Africa/Casablanca

# ---- Règles de réservation ----
# Délai de prévenance : on ne propose pas un créneau dans moins de 2 h.
app.reservation.delai-prevenance-minutes=${DELAI_PREVENANCE:120}
# Horizon : on ne prend pas de rendez-vous au-delà de 60 jours.
app.reservation.horizon-jours=${HORIZON_JOURS:60}

# ============================================================
#  Serveur
# ============================================================
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ============================================================
#  Keycloak — resource server OAuth2
# ============================================================
app.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/booking-realm}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.keycloak.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${app.keycloak.issuer-uri}/protocol/openid-connect/certs

# ============================================================
#  CORS
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
#  Notifications
#
#  L'email est le canal de départ, mais ce n'est pas celui qui
#  fonctionnera le mieux au Maroc : WhatsApp et le SMS y priment
#  largement. D'où l'interface CanalNotification — brancher un
#  second canal doit rester un adaptateur, pas une réécriture.
# ============================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.expediteur=${MAIL_FROM:ne-pas-repondre@booking.ma}
app.mail.actif=${MAIL_ACTIF:true}
app.url-publique=${URL_PUBLIQUE:http://localhost:5173}

# Rappel envoyé la veille : on cible les rendez-vous dont le début tombe
# dans cette fenêtre, exprimée en heures à partir de maintenant.
app.rappel.fenetre-min-heures=${RAPPEL_MIN:20}
app.rappel.fenetre-max-heures=${RAPPEL_MAX:28}
app.rappel.cron=${RAPPEL_CRON:0 17 * * * *}
