spring.application.name=booking

# ============================================================
#  Base de données
#  Aucune valeur par défaut pour le mot de passe : l'application
#  refuse de démarrer s'il n'est pas fourni, plutôt que de tourner
#  avec un secret codé en dur.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beauty_booking}
spring.datasource.username=${DB_USER:booking_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schéma appartient à Flyway. Hibernate se contente de vérifier que les
# entités correspondent — il ne crée ni ne modifie plus rien.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Les instants sont stockés en UTC ; la conversion vers l'heure locale
# se fait à la présentation. Indispensable au Maroc, qui bascule entre
# UTC+1 et UTC+0 à chaque Ramadan.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
#  Localisation — Maroc
# ============================================================
spring.jackson.time-zone=Africa/Casablanca
spring.web.locale=fr_MA
spring.web.locale-resolver=fixed
app.devise=MAD
app.fuseau=Africa/Casablanca

# ---- Règles de réservation ----
# Délai de prévenance : on ne propose pas un créneau dans moins de 2 h.
app.reservation.delai-prevenance-minutes=${DELAI_PREVENANCE:120}
# Horizon : on ne prend pas de rendez-vous au-delà de 60 jours.
app.reservation.horizon-jours=${HORIZON_JOURS:60}

# ============================================================
#  Serveur
# ============================================================
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ============================================================
#  Keycloak — resource server OAuth2
# ============================================================
app.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/booking-realm}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.keycloak.issuer-uri}

# Où lire les clés de signature.
#
# Dissociable de l'émetteur, et il faut le dissocier dès qu'un proxy s'en
# mêle. L'émetteur est ce que le navigateur voit — il figure dans les jetons
# et doit correspondre au caractère près. L'adresse des clés, elle, est
# appelée par l'API : derrière un proxy, la faire sortir par l'adresse
# publique pour revenir aussitôt est au mieux un détour, au pire impossible
# — dans un conteneur, « localhost » désigne l'API elle-même.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:${app.keycloak.issuer-uri}/protocol/openid-connect/certs}

# ============================================================
#  CORS
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
#  Notifications
#
#  L'email est le canal de départ, mais ce n'est pas celui qui
#  fonctionnera le mieux au Maroc : WhatsApp et le SMS y priment
#  largement. D'où l'interface CanalNotification — brancher un
#  second canal doit rester un adaptateur, pas une réécriture.
# ============================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.expediteur=${MAIL_FROM:ne-pas-repondre@booking.ma}
app.mail.actif=${MAIL_ACTIF:true}
app.url-publique=${URL_PUBLIQUE:http://localhost:5173}

# Rappel envoyé la veille : on cible les rendez-vous dont le début tombe
# dans cette fenêtre, exprimée en heures à partir de maintenant.
app.rappel.fenetre-min-heures=${RAPPEL_MIN:20}
app.rappel.fenetre-max-heures=${RAPPEL_MAX:28}
app.rappel.cron=${RAPPEL_CRON:0 17 * * * *}

# ============================================================
#  Documentation d'API
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.writer-with-order-by-keys=true
# Fermée par défaut, ouverte explicitement en développement.
#
# L'inverse — ouverte sauf mention contraire — a tenu jusqu'ici parce que
# personne n'avait exposé l'API en direct. Le schéma décrit toute la surface
# d'attaque : une variable oubliée doit échouer du côté fermé, pas l'inverse.
# scripts/lancer-api.sh et .env l'activent pour le poste de développement.
springdoc.api-docs.enabled=${OPENAPI_ACTIF:false}

# ============================================================
#  Limitation de débit sur /api/public/**
#
#  La route des disponibilités est trivialement aspirable.
#  Capacité = rafale tolérée, par-minute = débit soutenu.
#  Compteurs en mémoire, donc par instance : à remplacer par un
#  compteur partagé avant toute mise à l'échelle horizontale.
# ============================================================
app.rate-limit.actif=${RATE_LIMIT_ACTIF:true}
app.rate-limit.capacite=${RATE_LIMIT_CAPACITE:120}
app.rate-limit.par-minute=${RATE_LIMIT_PAR_MINUTE:240}

# ============================================================
#  Annulation depuis un email
#
#  Secret de signature des liens. Au moins 32 caractères, et
#  distinct du secret de tout autre usage : le changer invalide
#  tous les liens déjà envoyés.
# ============================================================
app.annulation.secret=${ANNULATION_SECRET:changez-ce-secret-de-developpement-uniquement}
app.annulation.validite-jours=${ANNULATION_VALIDITE_JOURS:90}

# ============================================================
#  Gestion des comptes professionnels
#
#  L'API crée les comptes des salons dans Keycloak. Elle
#  s'authentifie avec son propre client de service, jamais avec
#  les identifiants d'un administrateur humain : les droits sont
#  limités à la gestion des utilisateurs, et la révocation du
#  secret n'affecte personne d'autre.
# ============================================================
app.keycloak.realm=${KEYCLOAK_REALM:booking-realm}
app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
app.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:booking-backend-admin}
app.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:secret-de-developpement-a-remplacer}

# ============================================================
#  Point de santé
#
#  Exposé sur le même port que l'API, mais hors du préfixe /api :
#  le proxy ne route que /api vers ce service, si bien que la sonde
#  est joignable depuis l'intérieur du conteneur et invisible de
#  l'extérieur. C'est exactement ce qu'on veut d'une sonde.
#
#  never sur show-details : l'état des composants — base joignable,
#  espace disque, serveur de courrier — renseigne autant un attaquant
#  qu'un exploitant.
# ============================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Photos de salon
# ---------------------------------------------------------------------------
# Le binaire vit sur le disque, la base ne décrit que la photo : PostgreSQL
# n'est pas un serveur de fichiers, et une image en bytea alourdit chaque
# sauvegarde et chaque réplication.
#
# /!\ Ce répertoire doit être persistant. Sur un hébergement dont le disque est
# éphémère — la plupart des offres gérées —, les photos disparaîtraient à
# chaque redéploiement, sans erreur, avec seulement des images cassées sur les
# fiches. Il faudra alors un stockage objet : c'est StockagePhotos, et elle
# seule, qu'il y aura à remplacer.
app.photos.repertoire=${PHOTOS_REPERTOIRE:./donnees/photos}
app.photos.max-par-salon=${PHOTOS_MAX:6}
app.photos.taille-max-mo=${PHOTOS_TAILLE_MAX_MO:5}

# Le serveur refuse au-delà, avant même d'avoir tout lu. Une marge sur la
# limite applicative : l'enveloppe multipart pèse un peu plus que le fichier,
# et un refus au niveau du transport donne un message bien moins clair.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
